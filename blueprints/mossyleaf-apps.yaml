version: 1
metadata:
  name: mossyleaf - Applications
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Invalidation flow
      required: false

  - model: authentik_core.objectattribute
    identifiers:
      key: timezone
      managed: mossyleaf.studio/object-attrs/user/timezone
    attrs:
      object_type: authentik_core.user
      group: Settings
      label: Time zone (IANA, e.g. Europe/Paris)
      type: text
      enabled: true
      is_required: false
      is_unique: false

  - model: authentik_providers_oauth2.scopemapping
    id: scope-zoneinfo
    identifiers:
      name: "mossyleaf: zoneinfo"
    attrs:
      scope_name: profile
      description: Time zone
      expression: |
        timezone = request.user.attributes.get("timezone")
        return {"zoneinfo": timezone} if timezone else {}

  - model: authentik_core.group
    id: group-mossydew
    identifiers:
      name: mossydew
  - model: authentik_core.group
    id: group-mossytrunk
    identifiers:
      name: mossytrunk

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-mossydew
    identifiers:
      name: MossyDew
    attrs:
      client_type: confidential
      client_id: mossydew
      client_secret: !Env MOSSYDEW_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://mossydew.mossyleaf.studio/login/check
          redirect_uri_type: authorization
        - matching_mode: strict
          url: http://localhost:8090/login/check
          redirect_uri_type: authorization
        - matching_mode: strict
          url: https://mossydew.mossyleaf.studio/
          redirect_uri_type: logout
        - matching_mode: strict
          url: http://localhost:8090/
          redirect_uri_type: logout
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf scope-zoneinfo
  - model: authentik_core.application
    id: app-mossydew
    identifiers:
      slug: mossydew
    attrs:
      name: MossyDew
      provider: !KeyOf provider-mossydew
      policy_engine_mode: any
      meta_launch_url: https://mossydew.mossyleaf.studio/
      meta_description: Gamified task manager with a moss piglet companion
      meta_publisher: mossyleaf
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-mossydew
      group: !KeyOf group-mossydew
      order: 0
    attrs:
      enabled: true
      negate: false

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-mossytrunk
    identifiers:
      name: MossyTrunk
    attrs:
      client_type: confidential
      client_id: mossytrunk
      client_secret: !Env MOSSYTRUNK_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://mossytrunk.mossyleaf.studio/login/check
          redirect_uri_type: authorization
        - matching_mode: strict
          url: http://localhost:8080/login/check
          redirect_uri_type: authorization
        - matching_mode: strict
          url: https://mossytrunk.mossyleaf.studio/
          redirect_uri_type: logout
        - matching_mode: strict
          url: http://localhost:8080/
          redirect_uri_type: logout
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf scope-zoneinfo
  - model: authentik_core.application
    id: app-mossytrunk
    identifiers:
      slug: mossytrunk
    attrs:
      name: MossyTrunk
      provider: !KeyOf provider-mossytrunk
      policy_engine_mode: any
      meta_launch_url: https://mossytrunk.mossyleaf.studio/
      meta_description: Orders, stock and accounting for a small business
      meta_publisher: mossyleaf
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-mossytrunk
      group: !KeyOf group-mossytrunk
      order: 0
    attrs:
      enabled: true
      negate: false
