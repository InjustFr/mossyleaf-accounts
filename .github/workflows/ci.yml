name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - run: make up

      - run: make check

      - if: always()
        run: make shots

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
          if-no-files-found: ignore

      - if: failure()
        run: docker compose logs server worker

      - if: always()
        run: docker compose down --volumes
