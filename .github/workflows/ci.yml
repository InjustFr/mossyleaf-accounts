name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/injust/mossyleaf-accounts
  # Test the image as published: without compose.override.yaml's source mounts.
  COMPOSE_FILE: compose.yaml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - run: make up

      - run: make check

      - if: always()
        run: make shots

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
          if-no-files-found: ignore

      - if: failure()
        run: docker compose logs server worker

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          for tag in "$sha" latest; do
            docker tag mossyleaf-accounts:dev "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - if: always()
        run: docker compose down --volumes
