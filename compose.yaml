name: mossyleaf-accounts

x-authentik: &authentik
  image: mossyleaf-accounts:dev
  build: .
  restart: unless-stopped
  shm_size: 512mb
  depends_on:
    postgresql:
      condition: service_healthy
  environment: &authentik-env
    AUTHENTIK_SECRET_KEY: local-dev-secret-key-not-for-production-0123456789
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: authentik
    AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    AUTHENTIK_BOOTSTRAP_EMAIL: admin@mossyleaf.test
    AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-admin-password}
    AUTHENTIK_EMAIL__HOST: mailpit
    AUTHENTIK_EMAIL__PORT: 1025
    AUTHENTIK_EMAIL__USE_TLS: "false"
    AUTHENTIK_EMAIL__USE_SSL: "false"
    AUTHENTIK_EMAIL__FROM: mossyleaf <accounts@mossyleaf.test>
    MOSSYDEW_CLIENT_SECRET: ${MOSSYDEW_CLIENT_SECRET:-mossydew-local-secret}
    MOSSYTRUNK_CLIENT_SECRET: ${MOSSYTRUNK_CLIENT_SECRET:-mossytrunk-local-secret}
    MOSSYLEAF_STUDIO_CLIENT_SECRET: ${MOSSYLEAF_STUDIO_CLIENT_SECRET:-mossyleaf-studio-local-secret}
  volumes:
    - ./data:/data

services:
  postgresql:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 5s
      start_period: 20s
    volumes:
      - database:/var/lib/postgresql

  server:
    <<: *authentik
    command: server
    ports:
      - "${AUTHENTIK_PORT:-9000}:9000"

  worker:
    <<: *authentik
    command: worker
    user: root

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8027}:8025"

  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [tools]
    working_dir: /app
    volumes:
      - ./:/app

volumes:
  database:
